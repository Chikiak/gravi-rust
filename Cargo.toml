[workspace]
resolver = "2"
members = [
    "crates/gravi-core",
    "crates/gravi-ui",
    "tests/gravi-core-tests",
]
exclude = []

[workspace.lints]
rust = { unused = "warn", dead_code = "warn", unreachable_patterns = "warn" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 0
panic = "abort"

[profile.dev]
opt-level = 2
